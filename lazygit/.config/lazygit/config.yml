gui:
  sidePanelWidth: 0.28
  expandFocusedSidePanel: true
  shrinkSidePanelsToContent: true
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  showRandomTip: false

  theme:
    # ANSI colors inherit Ghostty's active Catppuccin Latte/Macchiato palette.
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - cyan
      - bold
    optionsTextColor:
      - blue
    # Reverse uses Ghostty's foreground/background for strong contrast in both
    # light and dark mode instead of placing dark text on a blue background.
    selectedLineBgColor:
      - reverse
      - bold
    inactiveViewSelectedLineBgColor:
      - reverse
    cherryPickedCommitFgColor:
      - blue
    cherryPickedCommitBgColor:
      - cyan
    markedBaseCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default

git:
  diffRenderers:
    - name: delta
      command: delta --paging=never
  localBranchSortOrder: recency

update:
  # Homebrew manages Lazygit updates.
  method: never

disableStartupPopups: true
